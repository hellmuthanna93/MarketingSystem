<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, initial-scale=1.0" />
    <title>Counseling Post Template - 1080×1080</title>
    <!-- Checklist: brand/marketing/content.md -->
    <!-- Formula: You think X. Actually, Y. That is why Z. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<link rel="stylesheet" href="../../../brand/tokens.css" />
    <link rel="stylesheet" href="../../../brand/typography.css" />
    <link rel="stylesheet" href="../../../brand/components.css" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
      }
      .post-frame {
        width: 1080px;
        height: 1080px;
        background: var(--color-surface);
        padding: 48px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .post-label {
        font-family: var(--font-body);
        font-size: 0.875rem;
        font-weight: var(--font-weight-semibold);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--color-accent);
      }
      .post-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: var(--space-xl) 0;
      }
      .post-hook {
        font-family: var(--font-heading);
        font-size: 2.25rem;
        font-weight: var(--font-weight-heading);
        line-height: 1.35;
        color: var(--color-text);
        margin-bottom: var(--space-xl);
      }
      .post-insight {
        font-family: var(--font-body);
        font-size: 1.35rem;
        line-height: 1.65;
        color: var(--color-text);
      }
      .post-insight strong {
        color: var(--color-accent);
      }
      .post-footer {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        border-top: 1px solid var(--color-border);
        padding-top: var(--space-lg);
      }
      .post-name {
        font-family: var(--font-heading);
        font-size: 1.1rem;
        font-weight: var(--font-weight-heading);
        color: var(--color-accent);
      }
      .post-handle {
        font-family: var(--font-body);
        font-size: 0.95rem;
        color: var(--color-text);
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <article class="post-frame">
      <p class="post-label">Psychological counseling</p>
      <div class="post-body">
        <p class="post-hook">You think you should be "over it" by now.</p>
        <p class="post-insight">
          <strong>Actually,</strong> your body is still holding what your mind tried to leave behind.
          <strong>That is why</strong> certain situations still catch you off guard - even when you understand them perfectly.
        </p>
      </div>
      <footer class="post-footer">
        <p class="post-name">Anna Hellmuth</p>
        <p class="post-handle">@anna_hellmuth.md</p>
      </footer>
    </article>
  </body>
</html>
